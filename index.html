<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHITEDAVIL | OS v10.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark" onclick="createRipple(event)">
    <div id="progress-bar"></div>
    <div id="live-clock" class="dot-matrix">00:00:00</div>
    <canvas id="bgCanvas"></canvas>
    <div id="theme-toggle" class="dot-matrix" onclick="toggleTheme()">THEME_SWAP</div>

    <div class="container">
        <div class="card reveal">
            <span class="tag dot-matrix">WHITEDAVIL_INTELLIGENCE_CORE</span>
            <span id="v-toggle" class="dot-matrix" onclick="toggleVoice()">VOICE: ON</span>
            <h2 class="dot-matrix ai-brand">WHITEDAVIL</h2>
            <div class="command-bar">
                <input type="text" id="ai-query" placeholder="Command WHITEDAVIL..." onkeypress="handleKey(event)">
                <button class="enter-btn" onclick="runAI()">ENTER</button>
            </div>
            <div id="ai-response" class="dot-matrix"></div>
        </div>

        <div class="card reveal">
            <span class="tag dot-matrix">DIGITAL_NODES</span>
            <div class="social-grid">
                <a href="https://youtube.com/@whitedavilartist" target="_blank" class="social-btn"><strong class="dot-matrix">YOUTUBE</strong></a>
                <a href="https://www.instagram.com/whitedevilart_?igsh=YTE5c2s4NTU5MWE0" target="_blank" class="social-btn"><strong class="dot-matrix">INSTAGRAM</strong></a>
            </div>
        </div>

        <div class="card reveal">
            <span class="tag dot-matrix">DEVELOPER_ID</span>
            <div style="margin-top:10px;">
                <p style="font-size: 1.5rem; font-weight: bold;">Nitish Kumar</p>
                <p class="dot-matrix" style="color: var(--n-red); font-weight: 700;">WHITEDAVIL_OS_v10.2</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
